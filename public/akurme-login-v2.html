<title>AKURME TRACK — Masuk</title>
<style>
:root{--navy:#142752;--gold:#DCA638;--goldt:#A57C2A;--b:#E3E8F0;--tx:#111827;--mt:#4B5563;--dm:#6B7280;--rd:#DC2626}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#F3F5F9;color:var(--tx);font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}
.card{width:100%;max-width:400px;background:#fff;border:1px solid var(--b);border-top:4px solid var(--gold);border-radius:14px;padding:36px 32px 28px;box-shadow:0 8px 30px rgba(17,24,39,.08)}
.brand{text-align:center;margin-bottom:24px}
.brand img{height:68px;width:auto;margin-bottom:10px}
.brand b{display:block;font-size:24px;font-weight:800;letter-spacing:2px;color:var(--navy)}
.brand span{display:block;font-size:11px;font-weight:700;letter-spacing:6px;color:var(--goldt);margin-top:2px}
.brand p{font-size:13px;color:var(--dm);margin-top:10px}
label{display:block;font-size:12px;font-weight:600;color:var(--mt);margin:14px 0 6px}
input{width:100%;padding:12px 14px;font-size:15px;font-family:inherit;color:var(--tx);background:#fff;border:1px solid #CBD2DE;border-radius:8px;outline:none}
input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(20,39,82,.12)}
button.go{width:100%;margin-top:22px;padding:13px;font-size:15px;font-weight:700;font-family:inherit;color:#fff;background:var(--navy);border:0;border-radius:8px;cursor:pointer}
button.go:hover{background:#1c3470}
button.go:disabled{opacity:.6;cursor:wait}
.err{display:none;margin-top:14px;padding:10px 12px;font-size:13px;color:var(--rd);background:#FEF2F2;border:1px solid #FECACA;border-radius:8px}
.drv{display:block;text-align:center;margin-top:20px;padding-top:18px;border-top:1px solid var(--b);font-size:13px;color:var(--mt);text-decoration:none}
.drv b{color:var(--navy)}
.foot{text-align:center;font-size:11px;color:var(--dm);margin-top:18px}
</style>
</head>

<script>
var t = localStorage.getItem('mf_token');
if (t) {
  fetch('/api/drivers', { headers: { 'x-auth-token': t } })
    .then(function (r) { if (r.ok) location.href = '/dashboard'; })
    .catch(function () {});
}
var btn = document.getElementById('btn'), err = document.getElementById('err');
function show(m) { err.textContent = m; err.style.display = 'block'; }
function login() {
  var u = document.getElementById('u').value.trim(), p = document.getElementById('p').value;
  if (!u || !p) { show('Username dan password wajib diisi'); return; }
  err.style.display = 'none'; btn.disabled = true; btn.textContent = 'Memeriksa...';
  fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: u, password: p }) })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      btn.disabled = false; btn.textContent = 'Masuk';
      if (d.error) { show(d.error); return; }
      localStorage.setItem('mf_token', d.token);
      localStorage.setItem('mf_name', d.name);
      localStorage.setItem('mf_role', d.role);
      location.href = '/dashboard';
    })
    .catch(function () { btn.disabled = false; btn.textContent = 'Masuk'; show('Gagal terhubung ke server. Coba lagi.'); });
}
btn.onclick = login;
document.addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
</script>
</body>
</html>

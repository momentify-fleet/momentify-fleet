<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Momentify — Armada Menuju Pool</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080c14;color:#e8f0fe;font-family:'Segoe UI',sans-serif;height:100vh;display:flex;flex-direction:column}
.hdr{background:#0d1420;border-bottom:1px solid #1e2d45;padding:14px 16px;flex-shrink:0}
.hdr h1{font-size:16px;font-weight:900;color:#00d4ff;margin-bottom:4px}
.hdr h1 span{color:#fff}
.hdr p{font-size:11px;color:#5c7a9e}
.info-row{display:flex;gap:8px;margin-top:10px}
.info-box{flex:1;background:#111b2e;border:1px solid #1e2d45;border-radius:8px;padding:8px 10px;text-align:center}
.ib-val{font-size:20px;font-weight:900;color:#00d4ff}
.ib-label{font-size:9px;color:#3a5070;margin-top:2px}
#map{flex:1}
.leaflet-tile{filter:brightness(0.75)}
.bottom{background:#0d1420;border-top:1px solid #1e2d45;padding:12px 16px;flex-shrink:0}
.eta-display{text-align:center;margin-bottom:8px}
.eta-num{font-size:48px;font-weight:900;color:#00e676;line-height:1}
.eta-unit{font-size:12px;color:#5c7a9e}
.progress-wrap{height:6px;background:#1e2d45;border-radius:3px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,#00d4ff,#00e676);border-radius:3px;transition:width 1s ease}
.status-msg{font-size:11px;color:#5c7a9e;text-align:center;margin-top:6px}
</style>
</head>
<body>

<div class="hdr">
  <h1>MOMENTIFY <span>FLEET</span></h1>
  <p>Pantau armada menuju pool penjemputan Anda</p>
  <div class="info-row">
    <div class="info-box">
      <div class="ib-val" id="distVal">—</div>
      <div class="ib-label">KM dari Pool</div>
    </div>
    <div class="info-box">
      <div class="ib-val" id="spdVal" style="color:#00d4ff">—</div>
      <div class="ib-label">km/h</div>
    </div>
    <div class="info-box">
      <div class="ib-val" id="viewVal" style="color:#ffcc00">—</div>
      <div class="ib-label">Menunggu</div>
    </div>
  </div>
</div>

<div id="map"></div>

<div class="bottom">
  <div class="eta-display">
    <div class="eta-num" id="etaNum">—</div>
    <div class="eta-unit">menit lagi tiba di pool</div>
  </div>
  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar" style="width:0%"></div>
  </div>
  <div class="status-msg" id="statusMsg">Menunggu data GPS armada...</div>
</div>

<script>
var SERVER = 'https://atop-crimp-jargon.ngrok-free.dev';
var code   = window.location.pathname.split('/').pop().toUpperCase();
var map, busMarker=null, poolMarker=null, totalDist=null;

map = L.map('map',{zoomControl:false,attributionControl:false}).setView([-6.9175,107.6191],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

// Load trip & posisi awal
fetch(SERVER+'/api/public/trip/'+code)
  .then(r=>r.json())
  .then(data=>{
    if (data.error) { document.querySelector('.status-msg').textContent='Trip tidak ditemukan'; return; }
    var trip = data.trip;
    document.querySelector('.hdr p').textContent = 'Armada '+trip.routeName+' menuju '+trip.origin;

    // Pool marker (origin = terminal keberangkatan)
    if (trip.destLat&&trip.destLng) {
      poolMarker = L.marker([trip.destLat,trip.destLng],{
        icon:L.divIcon({className:'',html:'<div style="font-size:28px">🚏</div>',iconSize:[28,28],iconAnchor:[14,28]})
      }).addTo(map).bindPopup('<b>Pool: '+trip.origin+'</b>');
    }
    if (data.driver) updateBus(data.driver, trip);
  });

var socket = io(SERVER,{transports:['websocket','polling']});
socket.on('connect',()=>socket.emit('join-trip',code));
socket.on('public-gps', function(d){
  if(d.tripCode!==code) return;
  updateBus(d, d);
});
socket.on('trip-viewers-update',function(d){
  if(d.code!==code) return;
  document.getElementById('viewVal').textContent=d.viewers;
});

function updateBus(d, trip) {
  var lat=parseFloat(d.lat),lng=parseFloat(d.lng);
  var spd=parseFloat(d.speed)||0;
  var eta=d.eta||0;
  var distKm = eta>0 ? (spd*eta/60).toFixed(1) : '—';

  document.getElementById('spdVal').textContent  = Math.round(spd);
  document.getElementById('distVal').textContent = distKm;
  document.getElementById('etaNum').textContent  = eta>0 ? eta : '< 1';
  document.getElementById('etaNum').style.color  = eta<=5?'#ffcc00':'#00e676';
  document.getElementById('statusMsg').textContent = eta<=5 ? '🚌 Armada hampir tiba! Bersiap di pool.' : '🚌 Armada sedang dalam perjalanan menuju pool';

  // Progress bar
  if (totalDist===null && eta>0 && spd>0) totalDist = spd*eta/60;
  if (totalDist) {
    var remaining = spd*eta/60;
    var pct = Math.min(100, Math.max(0, (1-remaining/totalDist)*100));
    document.getElementById('progressBar').style.width = pct+'%';
  }

  if (!busMarker) {
    busMarker = L.marker([lat,lng],{
      icon:L.divIcon({className:'',html:'<div style="font-size:32px;filter:drop-shadow(0 0 10px #00d4ff)">🚌</div>',iconSize:[32,32],iconAnchor:[16,16]})
    }).addTo(map).bindPopup('Posisi Armada');
    if (poolMarker) {
      var bounds = L.latLngBounds([[lat,lng],poolMarker.getLatLng()]);
      map.fitBounds(bounds,{padding:[30,30]});
    } else { map.setView([lat,lng],14); }
  } else { busMarker.setLatLng([lat,lng]); }
}
</script>
</body>
</html>
